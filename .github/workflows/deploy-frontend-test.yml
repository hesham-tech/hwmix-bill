name: Deploy Vue Frontend to Test Subdomain (SSH)

on:
  push:
    branches:
      - restructure-v2 # هذا هو البرانش الذي تعمل عليه حالياً

jobs:
  build-and-deploy:
    environment: legacy-testing
    timeout-minutes: 25
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Reject tracked secret material
        run: python3 tools/security/scan_tracked_secrets.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # تمكين كاش npm لتقليل مشاكل التحميل

      - name: Prepare npm for reliable fetches
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-factor 2
          npm config set fetch-retry-mintimeout 2000

      - name: Clean npm cache (optional — useful when CI shows integrity issues)
        run: npm cache clean --force

      - name: Install dependencies
        run: |
          npm ci --prefer-offline --no-audit --progress=false

      - name: Build project
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.TEST_API_URL }}

      - name: Configure trusted SSH host
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.LEGACY_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.LEGACY_SSH_PRIVATE_KEY }}

      - name: Ensure Remote Directory Exists
        run: |
          ssh -p ${{ vars.LEGACY_SSH_PORT }} -o StrictHostKeyChecking=yes -o BatchMode=yes -o ForwardAgent=no ${{ vars.LEGACY_SSH_USER }}@${{ vars.LEGACY_SSH_HOST }} "mkdir -p /home/u715355537/domains/hwnix.com/public_html/bill-teste/"

      - name: Deploy via Rsync
        run: |
          rsync -avz --delete -e "ssh -p ${{ vars.LEGACY_SSH_PORT }} -o StrictHostKeyChecking=yes -o BatchMode=yes -o ForwardAgent=no" ./dist/ ${{ vars.LEGACY_SSH_USER }}@${{ vars.LEGACY_SSH_HOST }}:/home/u715355537/domains/hwnix.com/public_html/bill-teste/