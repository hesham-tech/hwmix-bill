name: Deploy Vue Frontend to Test Subdomain (SSH)

on:
  push:
    branches:
      - restructure-v2 # هذا هو البرانش الذي تعمل عليه حالياً

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment: legacy-testing
    timeout-minutes: 25
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Reject tracked secret material
        run: python3 tools/security/scan_tracked_secrets.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # تمكين كاش npm لتقليل مشاكل التحميل

      - name: Prepare npm for reliable fetches
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-factor 2
          npm config set fetch-retry-mintimeout 2000

      - name: Clean npm cache (optional — useful when CI shows integrity issues)
        run: npm cache clean --force

      - name: Install dependencies
        run: |
          npm ci --legacy-peer-deps --prefer-offline --no-audit --progress=false

      - name: Build project
        run: npm run build
        env:
          VITE_API_BASE_URL: 'https://api-teste.hwnix.com/api/v1'
          VITE_API_URL: ${{ secrets.TEST_API_URL }}

      - name: Configure trusted SSH host
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.LEGACY_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.LEGACY_SSH_PRIVATE_KEY }}

      - name: Deploy via Rsync
        run: |
          rsync -avz --delete -e "ssh -p ${{ vars.LEGACY_SSH_PORT }} -o StrictHostKeyChecking=yes -o BatchMode=yes -o ForwardAgent=no -o ConnectTimeout=30 -o ServerAliveInterval=15" \
          --rsync-path="mkdir -p /home/u715355537/domains/hwnix.com/public_html/bill-teste/ && rsync" \
          ./dist/ ${{ vars.LEGACY_SSH_USER }}@${{ vars.LEGACY_SSH_HOST }}:/home/u715355537/domains/hwnix.com/public_html/bill-teste/

      - name: Run Post-Deployment Health Check
        run: |
          echo "🔍 Running Frontend health check on test subdomain..."
          curl -f -I https://bill-teste.hwnix.com || curl -f -I https://hwnix.com/bill-teste/ || exit 1